<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Project</title>
</head>
<body>

  <!-- About Section -->
  <section id="about">
    <h2>About Us</h2>
    <p>Welcome to our website! We are passionate about delivering quality content and services to our users. Our mission is to create engaging and informative experiences that make a difference.</p>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <h2>Contact Us</h2>
    <form action="#" method="post">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send</button>
    </form>
  </section>

</body>
</html>
