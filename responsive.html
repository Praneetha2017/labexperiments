<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Web Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
    }

    header {
      background-color: #0077cc;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .responsive-img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 20px auto;
    }

    p {
      text-align: center;
      font-size: 1.2em;
    }

    /* Media Queries */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      header {
        font-size: 1.2em;
      }

      p {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Responsive Page</h1>
  </header>
  <main>
    <img src="https://via.placeholder.com/600x300" alt="Sample Image" class="responsive-img" />
    <p>This page adjusts beautifully across devices!</p>
  </main>
</body>
</html>
